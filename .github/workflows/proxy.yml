name: Start browser web proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start authenticated web proxy and temporary tunnel
        env:
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROX_PASS: ${{ secrets.PROX_PASS }}
        run: |
          set -euo pipefail

          if ! python3 -c 'import os, sys; from proxy_server import validate_credentials; sys.exit(0 if validate_credentials(os.environ.get("PROXY_USER", ""), os.environ.get("PROX_PASS", "")) else 1)'; then
            echo "PROXY_USER must be 1-64 letters, digits, dots, underscores, or hyphens; PROX_PASS must be at least 32 printable characters."
            exit 1
          fi

          python3 proxy_server.py >"$RUNNER_TEMP/proxy.log" 2>&1 &
          server_pid=$!
          cloudflared_pid=""

          cleanup() {
            if [[ -n "$cloudflared_pid" ]]; then
              kill "$cloudflared_pid" 2>/dev/null || true
            fi
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent --show-error http://127.0.0.1:8080/healthz >/dev/null; then
            cat "$RUNNER_TEMP/proxy.log"
            echo "The web proxy failed to start."
            exit 1
          fi

          curl --fail --silent --show-error --location \
            https://github.com/cloudflare/cloudflared/releases/download/2026.11.1/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"

          "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate \
            --url http://127.0.0.1:8080 \
            >"$RUNNER_TEMP/cloudflared.log" 2>&1 &
          cloudflared_pid=$!

          tunnel_url=""
          for attempt in $(seq 1 60); do
            if ! kill -0 "$cloudflared_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/cloudflared.log"
              echo "cloudflared exited before the tunnel was ready."
              exit 1
            fi
            tunnel_url="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' \
              "$RUNNER_TEMP/cloudflared.log" | head -n 1 || true)"
            if [[ -n "$tunnel_url" ]]; then
              break
            fi
            sleep 1
          done

          if [[ -z "$tunnel_url" ]]; then
            cat "$RUNNER_TEMP/cloudflared.log"
            echo "Could not obtain a Quick Tunnel URL."
            exit 1
          fi

          echo "Open this URL in a browser: $tunnel_url"
          echo "When prompted, enter the PROXY_USER and PROX_PASS repository secrets."
          wait "$cloudflared_pid"
