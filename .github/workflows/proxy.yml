name: Start browser web proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start authenticated web proxy and temporary tunnel
        env:
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! "$PROXY_USER" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "Set PROXY_USER to 1-64 letters, digits, dots, underscores, or hyphens."
            exit 1
          fi
          if [[ ! "$PROXY_PASSWORD" =~ ^[A-Za-z0-9_-]{32,}$ ]]; then
            echo "Set PROXY_PASSWORD to at least 32 letters, digits, underscores, or hyphens."
            exit 1
          fi

          python3 proxy_server.py &
          server_pid=$!
          cloudflared_pid=""

          cleanup() {
            if [[ -n "$cloudflared_pid" ]]; then
              kill "$cloudflared_pid" 2>/dev/null || true
            fi
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz >/dev/null

          curl --fail --silent --show-error --location \
            https://github.com/cloudflare/cloudflared/releases/download/2026.11.1/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"

          "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate \
            --url http://127.0.0.1:8080 \
            >"$RUNNER_TEMP/cloudflared.log" 2>&1 &
          cloudflared_pid=$!

          tunnel_url=""
          for attempt in $(seq 1 60); do
            if ! kill -0 "$cloudflared_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/cloudflared.log"
              echo "cloudflared exited before the tunnel was ready."
              exit 1
            fi
            tunnel_url="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' \
              "$RUNNER_TEMP/cloudflared.log" | head -n 1 || true)"
            if [[ -n "$tunnel_url" ]]; then
              break
            fi
            sleep 1
          done

          if [[ -z "$tunnel_url" ]]; then
            cat "$RUNNER_TEMP/cloudflared.log"
            echo "Could not obtain a Quick Tunnel URL."
            exit 1
          fi

          echo "Open this URL in a browser: $tunnel_url"
          echo "When prompted, enter the PROXY_USER and PROXY_PASSWORD repository secrets."
          wait "$cloudflared_pid"
